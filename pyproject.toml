[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "falcon-strike-ai"
version = "0.1.0"
description = "Agentic AI Automated Red Teaming & Continuous Threat Exposure Management Engine"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary / Internal Confidential" }
authors = [
    { name = "Adversary Emulation Engineering", email = "redteam-engineering@crowdstrike.internal" }
]
keywords = [
    "adversary-emulation",
    "ctem",
    "red-team",
    "mitre-attack",
    "cloud-security",
    "attack-path-analysis"
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "boto3>=1.34.0",
    "cryptography>=42.0.0",
    "pyjwt>=2.8.0",
    "opentelemetry-api>=1.25.0",
    "networkx>=3.2.0",
    "jinja2>=3.1.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
    "python-json-logger>=2.0.7",
    "reportlab>=4.2.0",
    "docker>=7.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "neo4j>=5.15.0",
]

[project.scripts]
falcon-strike = "backend.app.main:run_cli"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["backend/tests"]
pythonpath = ["backend"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]
addopts = "-ra -q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "C4", "UP"]
ignore = ["B008", "E501", "B904"]

[tool.coverage.run]
source = ["backend/app"]
branch = true
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 70

